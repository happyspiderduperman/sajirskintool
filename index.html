        body {

        }

            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }

        .page1-image-container {
            width: 100%;
            max-width: 250px;
            height: 200px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        .page1-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .blue-btn {
            background-color: #0066cc;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .blue-btn:hover {
            background-color: #004C99;
        }

        /* Input Styling */
        .password-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
        }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1rem;
            text-align: center;
            width: 100%;
        }

        /* Free Fire Version Selection Cards */
        .version-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
        }

        .version-box {
            background-color: #1e1e1e;
            border: 2px solid #0066cc;
            border-radius: 8px;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .version-box:hover {
            background-color: #0066cc;
            color: #fff;
        }

        /* 20 Boxes Grid Styling - CHANGED TO SINGLE COLUMN FOR BIGGER IMAGES */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .item-box {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .item-box img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 5px;
            background-color: #000;
        }

        .claim-btn {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .claim-btn:hover {
            background-color: #e6b800;
        }

        /* Quiz Page Options */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .quiz-opt {
            background-color: #1e1e1e;
            border: 2px solid #444;
            color: white;
            padding: 15px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .quiz-opt.correct {
            background-color: #2e7d32 !important;
            border-color: #4caf50 !important;
            color: #fff !important;
        }

        .quiz-opt.wrong {
            background-color: #c62828 !important;
            border-color: #ef5350 !important;
            color: #fff !important;
        }

        /* Generic Card Container */
        .form-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }

        .form-card label {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .success-message {

        }

        .fail-message {

            color: #ff3333;
            line-height: 1.5;
            font-weight: bold;

    </style>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;

            } else {

            }
        }

        function selectVersion() {
            showPage('page3');
        }

        function openQuizPage() {
            document.querySelectorAll('.quiz-opt').forEach(btn => {
                btn.className = 'quiz-opt';
                btn.disabled = false;
            });
            showPage('pageQuiz');
        }

        function checkAnswer(selectedOption) {
            const optA = document.getElementById('optA');
            const optB = document.getElementById('optB');
            const optC = document.getElementById('optC');
            const optD = document.getElementById('optD');

            document.querySelectorAll('.quiz-opt').forEach(btn => btn.disabled = true);

            if (selectedOption === 'D') {
                optD.classList.add('correct');
                optA.classList.add('wrong');
                optB.classList.add('wrong');
                optC.classList.add('wrong');

                setTimeout(() => {
                    showPage('pageUid');
                }, 1200);
            } else {
                optA.classList.add('wrong');
                optB.classList.add('wrong');
                optC.classList.add('wrong');
                optD.classList.add('correct');

                setTimeout(() => {
                    showPage('pageWrong');
                }, 1200);
            }
        }

        function submitUid() {
            const uid = document.getElementById('uidInput').value;
            if (uid.trim() === '') {
                alert('Please enter a valid UID');
                return;
            }
            showPage('pageSuccess');
        }
